<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Tesla-optimierte Karaoke-App mit LRC-Synchronisierung" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>Tesla Karaoke</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">🎤</div>
          <div class="brand-text">
            <small>KARAOKE</small>
            <h1>Songbook</h1>
          </div>
        </div>

        <div class="search-wrap">
          <input id="songSearch" type="search" placeholder="Liednummer / Titel..." />
        </div>

        <div class="filter-group">
          <div class="row">
            <span>Kategorien</span>
            <button id="clearFiltersBtn" class="small-btn" type="button">Alle</button>
          </div>
          <div id="categoryFilters" class="chip-list"></div>
        </div>

        <div class="toggle-row">
          <button id="favoritesToggle" class="primary-btn" type="button" aria-pressed="false">
            Nur Favoriten
          </button>
        </div>

        <div class="subpanel">
          <div class="row">
            <span>Zuletzt gespielt</span>
          </div>
          <ul id="recentSongs" class="recent-list"></ul>
        </div>

        <div class="subpanel list-panel">
          <div class="row">
            <span>Lieder</span>
            <strong id="songCount">0</strong>
          </div>
          <ul id="songList" class="song-list"></ul>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button id="installBtn" class="ghost-btn hidden" type="button">App installieren</button>
          <button id="toggleFullscreen" class="ghost-btn" type="button">Vollbild</button>
        </header>

        <section class="meta card">
          <div class="meta-header">
            <span>AKTUELLES LIED</span>
            <button id="favoriteBtn" class="fav-btn" type="button" aria-label="Favorit setzen">♡</button>
          </div>
          <h2 id="currentTitle">Lied auswählen</h2>
          <p id="currentStatus">Bitte ein Lied wählen.</p>
        </section>

        <section class="player card">
          <audio id="audio" preload="metadata"></audio>

          <div class="player-row">
            <button id="playPauseBtn" class="play-btn" type="button" aria-label="Abspielen">▶</button>

            <div class="time-box">
              <div class="time-row">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
              </div>

              <input
                id="progressBar"
                class="progress-input"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Fortschrittsbalken"
              />
            </div>
          </div>
        </section>

        <section class="lyrics-panel card" aria-label="Liedtext">
          <div id="lyrics" class="lyrics"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
