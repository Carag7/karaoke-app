<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Karaoke Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <div class="sidebar">
      <h1>🎤 Karaoke</h1>
      <input type="search" id="songSearch" placeholder="Search songs..." class="search-input" />
      <div class="song-list-container">
        <h3>Songs (<span id="songCount">0</span>)</h3>
        <ul id="songList" class="song-list"></ul>
      </div>
    </div>

    <div class="main-content">
      <div class="player-section">
        <div class="song-info">
          <h2 id="currentTitle">Select a song</h2>
          <p id="currentStatus">Ready</p>
        </div>

        <div class="player-controls">
          <button id="playBtn" class="btn play-btn">▶ PLAY</button>
          <div class="progress-section">
            <span id="currentTime">0:00</span>
            <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" />
            <span id="duration">0:00</span>
          </div>
        </div>

        <audio id="audioPlayer" crossorigin="anonymous"></audio>
      </div>

      <div class="lyrics-section">
        <div id="lyricsList" class="lyrics-list"></div>
      </div>
    </div>
  </div>

  <script src="karaoke.js"></script>
</body>
</html>
